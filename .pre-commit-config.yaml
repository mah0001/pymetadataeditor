repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: package.lock.json
        args: ["--exclude-lines", "\\s*\"image/png\": \".+\""]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.3  # Use the latest version
    hooks:
      - id: ruff
        files: \.py$
      - id: ruff-format
        args: ["--line-length", "120"]
        files: \.py$